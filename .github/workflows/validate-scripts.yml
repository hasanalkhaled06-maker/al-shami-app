name: Validate application scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check customer.js
          node --check admin.js
          node --check admin-operations.js
          node --check pwa.js
          node --check rider.js
          node --check service-worker.js
          node --test tests/*.test.cjs
